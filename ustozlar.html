<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaqtinchalik Cheklov | Boysun IM</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <style>
        :root {
            --restriction-color: #ff4757;
            --restriction-glow: rgba(255, 71, 87, 0.4);
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            background: #0f172a;
        }

        .restriction-container {
            max-width: 500px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
            z-index: 10;
        }

        .alert-icon {
            font-size: 5rem;
            color: var(--restriction-color);
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px var(--restriction-glow));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .restriction-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .countdown-wrapper {
            margin-top: 20px;
        }

        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .timer-progress {
            height: 100%;
            background: var(--restriction-color);
            width: 100%;
            transition: width 1s linear;
        }

        .timer-text {
            color: var(--restriction-color);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-home {
            margin-top: 30px;
            display: inline-block;
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
        }

        /* Mobile specific adjustments */
        @media (max-width: 576px) {
            .restriction-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            .alert-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>

<body class="dark-mode">
    <div class="background-effects">
        <div class="blob" style="background: var(--restriction-glow);"></div>
        <div class="blob blob-2" style="background: rgba(59, 130, 246, 0.2);"></div>
    </div>

    <div class="restriction-container">
        <div class="alert-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <div class="restriction-card">
            <h1>Vaqtinchalik cheklov</h1>
            <p>Hurmatli ustoz, <b>Ustozlar bo'limi</b> vaqtinchalik ishlamaydi, texnik xatolar tuzatilayapdi.
                Keltirilgan noqulayliklar uchun uzr so'raymiz.</p>

            <div class="countdown-wrapper">
                <div class="timer-bar">
                    <div id="progress" class="timer-progress"></div>
                </div>
                <div class="timer-text">
                    <span id="seconds">10</span> soniyadan so'ng qaytariladi...
                </div>
            </div>

            <a href="index.html" class="back-home">
                <i class="fas fa-home me-2"></i> Bosh sahifa
            </a>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const secondsSpan = document.getElementById('seconds');
        const progress = document.getElementById('progress');

        const timer = setInterval(() => {
            timeLeft--;
            secondsSpan.textContent = timeLeft;

            // Progress bar update
            const width = (timeLeft / 10) * 100;
            progress.style.width = width + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);

        // Instant redirect prevention on manual clicks if needed
        document.querySelector('.back-home').addEventListener('click', (e) => {
            clearInterval(timer);
        });
    </script>
</body>

</html>
